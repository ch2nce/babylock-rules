name: sync rules

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    paths: ["manual.json", "sync.py"]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python sync.py
      - name: commit
        run: |
          if git diff --quiet rules.json; then exit 0; fi
          git config user.name "rules-bot"
          git config user.email "actions@users.noreply.github.com"
          git add rules.json
          git commit -m "rules.json 자동 갱신"
          git push